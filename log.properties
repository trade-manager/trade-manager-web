
# Log file and console logging values.
# Log Values are TRACE, DEBUG, INFO, WARN, ERROR
# The root logger with appender name
# Root Logger
property.filename = ../logs/trade.log
property.filename.debug = ../logs/trade-debug.log

rootLogger.level = INFO
rootLogger.appenderRef.0.ref = CONSOLE
rootLogger.appenderRef.0.level = WARN
rootLogger.appenderRef.1.ref = MAIN
rootLogger.appenderRef.1.level = WARN
# rootLogger.appenderRef.2.ref = DEBUG_LOG

appender.0.type = Console
appender.0.name = CONSOLE
appender.0.layout.type = PatternLayout
appender.0.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

appender.1.type = File
appender.1.name = MAIN
appender.1.fileName = ${filename}
appender.1.layout.type = PatternLayout
appender.1.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

appender.2.type = File
appender.2.name = DEBUG_LOG
appender.2.fileName = ${filename.debug}
appender.2.layout.type = PatternLayout
appender.2.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

logger.0.name = org.springframework
logger.0.level = WARN
logger.0.additivity = false
logger.0.appenderRef.0.ref = MAIN

logger.1.name = org.hibernate
logger.1.level = WARN
logger.1.additivity = false
logger.1.appenderRef.0.ref = MAIN

# Use DEBUG_LOG to send to a trade-debug file.
logger.2.name = org.trade
logger.2.level = INFO
logger.2.appenderRef.0.ref = CONSOLE
logger.2.appenderRef.1.ref = DEBUG_LOG



